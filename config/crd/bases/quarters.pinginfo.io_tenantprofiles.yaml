kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tenantprofiles.quarters.pinginfo.io
spec:
  group: quarters.pinginfo.io
  names:
    kind: TenantProfile
    listKind: TenantProfileList
    plural: tenantprofiles
    singular: tenantprofile
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenantProfile is a named set of defaults referenced by Tenants.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TenantProfileSpec holds the defaults a Tenant inherits (the old values.yaml
              "defaults" block). A Tenant only states what differs.
            properties:
              limitRange:
                description: limitRange configures the per-container LimitRange.
                properties:
                  default:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: default is the limit applied to containers that do
                      not set one.
                    type: object
                  defaultRequest:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: defaultRequest is the request applied to containers
                      that do not set one.
                    type: object
                  max:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: max is the maximum a container may set.
                    type: object
                  min:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: min is the minimum a container must set.
                    type: object
                type: object
              network:
                description: network configures the Cilium network policies of the
                  namespace.
                properties:
                  egress:
                    description: |-
                      EgressSpec lists where the pods may connect to. When nothing is allowed, all
                      egress is denied. DNS to kube-dns is always allowed once any egress is.
                    properties:
                      allowAll:
                        description: allowAll allows all egress traffic.
                        type: boolean
                      allowKubeAPIServer:
                        description: allowKubeAPIServer allows the Cilium "kube-apiserver"
                          entity.
                        type: boolean
                      toCIDRs:
                        description: toCIDRs lists CIDR ranges the pods may reach.
                        items:
                          description: CIDRRule allows a CIDR range minus some exceptions.
                          properties:
                            cidr:
                              type: string
                            except:
                              items:
                                type: string
                              type: array
                          required:
                          - cidr
                          type: object
                        type: array
                      toFQDNs:
                        description: toFQDNs lists DNS names the pods may reach.
                        items:
                          description: FQDNRule allows a DNS name (exact or pattern)
                            on some ports.
                          properties:
                            matchName:
                              type: string
                            matchPattern:
                              type: string
                            ports:
                              items:
                                description: PortRule is a port and protocol.
                                properties:
                                  port:
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                  protocol:
                                    default: TCP
                                    enum:
                                    - TCP
                                    - UDP
                                    - SCTP
                                    type: string
                                required:
                                - port
                                type: object
                              type: array
                          type: object
                        type: array
                      toNamespaces:
                        description: toNamespaces lists namespace names the pods may
                          reach.
                        items:
                          type: string
                        type: array
                    type: object
                  ingress:
                    description: |-
                      IngressSpec lists what may reach the pods. When nothing is allowed, all
                      ingress is denied.
                    properties:
                      allowCiliumIngress:
                        description: allowCiliumIngress allows the Cilium "ingress"
                          entity (Cilium Ingress / Gateway).
                        type: boolean
                      allowFromNamespaces:
                        description: allowFromNamespaces lists namespace names that
                          may reach the pods.
                        items:
                          type: string
                        type: array
                      allowSameNamespace:
                        description: allowSameNamespace allows traffic between pods
                          of the namespace.
                        type: boolean
                    type: object
                type: object
              podSecurity:
                description: podSecurity sets the Pod Security Admission labels on
                  the namespace.
                properties:
                  audit:
                    description: PodSecurityLevel is a Pod Security Standard level.
                    enum:
                    - privileged
                    - baseline
                    - restricted
                    type: string
                  enforce:
                    description: PodSecurityLevel is a Pod Security Standard level.
                    enum:
                    - privileged
                    - baseline
                    - restricted
                    type: string
                  warn:
                    description: PodSecurityLevel is a Pod Security Standard level.
                    enum:
                    - privileged
                    - baseline
                    - restricted
                    type: string
                type: object
              quota:
                additionalProperties:
