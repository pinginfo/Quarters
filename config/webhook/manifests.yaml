---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-quarters-pinginfo-io-v1alpha1-tenant
  failurePolicy: Fail
  name: vtenant-v1alpha1.kb.io
  rules:
  - apiGroups:
    - quarters.pinginfo.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tenants
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-quarters-pinginfo-io-v1alpha1-tenantprofile
  failurePolicy: Fail
  name: vtenantprofile-v1alpha1.kb.io
  rules:
  - apiGroups:
    - quarters.pinginfo.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tenantprofiles
  sideEffects: None
