              scheduling:
                description: scheduling forces or restricts node placement of the
                  pods of the namespace.
                properties:
                  nodeSelector:
                    description: 'NodeSelectorSpec is a generic label selector, for
                      example {location: site-a}.'
                    properties:
                      labels:
